<div class="auth-container">
  <h2>Forgot Password</h2>
  <p style="text-align: center; color: #666; margin-bottom: 1.5rem;">Enter your email address and we'll help you reset your password.</p>
  
  <form (ngSubmit)="submit()">
    <label>
      Email Address
      <input type="email" [ngModel]="email()" (ngModelChange)="email.set($event)" name="email" required placeholder="you@example.com" />
    </label>

    @if (message()) {
      <p class="alert-success" style="text-align: center;">{{ message() }}</p>
    }
    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <button type="submit" class="btn btn-primary btn-block" [disabled]="loading() || !email()">
      {{ loading() ? 'Verifying...' : 'Continue' }}
    </button>
  </form>
  
  <p style="text-align: center; margin-top: 1rem;">
    <a routerLink="/login">Back to Login</a>
  </p>
</div>
