<div class="auth-container">
  <h2>Reset Password</h2>
    <p style="text-align: center; color: #666; margin-bottom: 1.5rem;">Create a new password to secure your account.</p>
  
  <form (ngSubmit)="submit()">
    
    <!-- New Password -->
    <label>
      New Password
      <div class="password-wrapper">
        <input [type]="showPassword() ? 'text' : 'password'" [ngModel]="password()" (ngModelChange)="password.set($event)" name="password" required placeholder="At least 6 characters" />
        <button type="button" class="eye-btn" (click)="togglePassword()">
          @if (showPassword()) {
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          } @else {
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
          }
        </button>
      </div>
    </label>

    <!-- Confirm Password -->
    <label>
      Confirm Password
      <div class="password-wrapper">
        <input [type]="showConfirm() ? 'text' : 'password'" [ngModel]="confirmPassword()" (ngModelChange)="confirmPassword.set($event)" name="confirmPassword" required placeholder="Re-type password" />
        <button type="button" class="eye-btn" (click)="toggleConfirm()">
          @if (showConfirm()) {
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          } @else {
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
          }
        </button>
      </div>
    </label>

    @if (message()) {
      <p class="alert-success" style="text-align: center;">{{ message() }}</p>
    }
    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <button type="submit" class="btn btn-primary btn-block" [disabled]="loading() || !password() || !confirmPassword()">
      {{ loading() ? 'Resetting...' : 'Reset Password' }}
    </button>
  </form>
  
  <p style="text-align: center; margin-top: 1rem;">
    <a routerLink="/login">Back to Login</a>
  </p>
</div>
