name: Deploy to Local Server

on:
  workflow_run:
    workflows: ["CI"] # This waits for your existing CI pipeline to finish
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: self-hosted # This tells GitHub to use YOUR machine
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Restart Docker Containers
        run: |
          docker compose down
          docker compose up -d --build